services:
  backend:
    build:
      context: ./backend
    image: navigate-backend:local
    env_file:
      - .env
    environment:
      NAVIGATE_DATABASE_URL: sqlite:////data/navigate.db
      NAVIGATE_CORS_ORIGINS: ${NAVIGATE_CORS_ORIGINS:-http://127.0.0.1:3080,http://localhost:3080}
      NAVIGATE_PUBLIC_ORIGIN: ${NAVIGATE_PUBLIC_ORIGIN:-}
    volumes:
      - ./backend/data:/data
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/live')",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  crawler:
    build:
      context: ./backend
    image: navigate-backend:local
    depends_on:
      backend:
        condition: service_healthy
    env_file:
      - .env
    environment:
      NAVIGATE_DATABASE_URL: sqlite:////data/navigate.db
      NAVIGATE_SKIP_MIGRATIONS: "1"
      TZ: Asia/Shanghai
    volumes:
      - ./backend/data:/data
    command:
      [
        "python",
        "-m",
        "scripts.run_due_sources",
        "--watch",
        "--poll-seconds",
        "60",
      ]
    restart: unless-stopped

  web:
    build:
      context: ./frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "3080:80"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/health/live"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  cloudflared:
    image: cloudflare/cloudflared:latest
    network_mode: "service:web"
    depends_on:
      web:
        condition: service_healthy
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN}
    command: tunnel --no-autoupdate --protocol http2 run
    restart: unless-stopped
